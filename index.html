<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Food Guessing Game</title>
    <!-- Include Socket.io Client -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.0/dist/socket.io.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --self-msg: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --peer-msg: #f1f5f9;
            --accent-green: #10b981;
            --accent-green-bg: #ecfdf5;
            --accent-red: #ef4444;
            --accent-red-bg: #fef2f2;
            --border-color: #e2e8f0;
            --shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08);
            --radius: 16px;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        h2 { text-align: center; color: var(--primary); margin: 0 0 24px 0; font-size: 28px; }
        .hidden { display: none !important; }

        .divider {
            text-align: center; margin: 24px 0; color: var(--text-muted);
            font-size: 12px; font-weight: 700; text-transform: uppercase;
        }

        input, button { font-family: inherit; font-size: 15px; border-radius: 12px; outline: none; }

        input {
            padding: 14px 18px; width: 100%; border: 1.5px solid var(--border-color);
            background: #f8fafc; color: var(--text-main);
        }

        button {
            padding: 14px 22px; background: var(--primary); color: white;
            border: none; cursor: pointer; font-weight: 600; width: 100%;
        }

        button:hover { background: var(--primary-hover); }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }

        .secret-banner {
            background: #fffbe6; border: 1px solid #ffe066; padding: 18px;
            border-radius: 14px; text-align: center; margin-bottom: 20px;
        }
        .secret-banner strong { color: #d97706; font-size: 22px; margin-left: 6px; }

        .status-wrapper { text-align: center; margin-bottom: 16px; }
        #turn-indicator {
            font-weight: 600; font-size: 13px; padding: 8px 18px;
            border-radius: 30px; display: inline-flex; align-items: center; gap: 8px;
        }

        #chat-box {
            height: 300px; border: 1px solid var(--border-color); border-radius: 14px;
            overflow-y: auto; padding: 16px; background: #f8fafc; margin-bottom: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .message { padding: 12px 16px; border-radius: 16px; max-width: 80%; word-break: break-word; font-size: 14px; }
        .message.system { background: #e2e8f0; color: var(--text-muted); align-self: center; font-size: 12px; }
        .message.self { background: var(--self-msg); color: white; align-self: flex-end; }
        .message.peer { background: var(--peer-msg); color: var(--text-main); align-self: flex-start; border: 1px solid var(--border-color); }

        .input-group { display: flex; gap: 10px; }
        #code-display { font-size: 32px; font-weight: 800; letter-spacing: 6px; color: var(--primary); background: #f1f5f9; padding: 16px; border-radius: 12px; text-align: center; margin: 16px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Secret Food</h2>

    <div id="lobby-section">
        <button id="create-btn" onclick="createGame()">Create New Room</button>
        <div class="divider">OR</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <input type="text" id="code-input" placeholder="Enter room code">
            <button id="join-btn" onclick="joinGame()" style="background: #334155;">Join Game</button>
        </div>
    </div>

    <div id="waiting-section" class="hidden" style="text-align: center;">
        <p style="color: var(--text-muted); margin-bottom: 4px;">Share this room code:</p>
        <div id="code-display"></div>
        <p style="color: var(--text-muted); font-size: 14px;">Waiting for player 2 to join...</p>
    </div>

    <div id="game-section" class="hidden">
        <div class="secret-banner">
            Your Secret: <strong id="my-secret">?</strong>
            <div style="font-size:13px; color:#b45309; margin-top:4px;">Guide the opponent to guess this food!</div>
        </div>

        <div class="status-wrapper">
            <div id="turn-indicator">Connecting...</div>
        </div>

        <div id="chat-box"></div>

        <div class="input-group">
            <input type="text" id="msg-input" placeholder="Ask a question or make a guess..." onkeypress="checkEnter(event)" disabled>
            <button id="send-btn" onclick="sendMessage()" style="width: 80px;" disabled>Send</button>
        </div>
        
        <button id="reset-btn" onclick="location.reload()" class="hidden" style="background: var(--accent-green); margin-top: 14px;">Play Again</button>
    </div>
</div>

<script>
    const prefixes = ["Super", "Mega", "Cheesy", "Choco", "Crispy", "Sweet", "Spicy", "Garlic", "Honey", "Mini", "Giant", "Smokey", "Berry", "Butter", "Fruity", "Glazed", "Golden", "Truffle", "Toasted", "Salty", "Fresh", "Tangy", "Milky", "Nutty"];
    const baseFoods = ["burger", "pizza", "taco", "sushi", "apple", "donut", "pancake", "cookie", "noodle", "pasta", "waffle", "muffin", "steak", "pickle", "potato", "pretzel", "brownie", "maki", "bacon", "toast", "bagel", "nacho", "ramen", "cupcake", "tart", "bread", "cheese", "sandwich", "cherry", "mango", "berry", "melon", "biscuit", "crepe", "fondue", "kebab", "omelet", "paella", "pie", "salad"];

    const foods = [];
    for (let p of prefixes) {
        for (let b of baseFoods) {
            foods.push(p + b.charAt(0).toUpperCase() + b.slice(1));
        }
    }

    // Connected directly to your live Render backend
    const RENDER_SERVER_URL = "https://food-guessing-game.onrender.com";
    const socket = io(RENDER_SERVER_URL);

    let currentRoomCode = "";
    let mySecretFood = foods[Math.floor(Math.random() * foods.length)];
    let opponentSecretFood = "";
    let isMyTurn = false;
    let gameOver = false;

    document.getElementById('my-secret').innerText = mySecretFood;

    function generateCode() {
        return Math.random().toString(36).substring(2, 6).toUpperCase();
    }

    function createGame() {
        currentRoomCode = generateCode();
        document.getElementById('lobby-section').classList.add('hidden');
        document.getElementById('waiting-section').classList.remove('hidden');
        document.getElementById('code-display').innerText = currentRoomCode;

        socket.emit("create-room", { roomCode: currentRoomCode, secret: mySecretFood });
    }

    function joinGame() {
        const code = document.getElementById('code-input').value.trim().toUpperCase();
        if (!code) return alert("Enter code");
        currentRoomCode = code;

        socket.emit("join-room", { roomCode: currentRoomCode, secret: mySecretFood });
    }

    socket.on("game-start", ({ opponentSecret, isHost }) => {
        opponentSecretFood = opponentSecret;
        isMyTurn = isHost;

        document.getElementById('waiting-section').classList.add('hidden');
        document.getElementById('lobby-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');

        updateTurnUI();
        enableChat(isHost);
        appendSystemMessage(isHost ? "Player 2 joined! Your turn." : "Connected! Host goes first.");
    });

    socket.on("receive-message", ({ text }) => {
        appendMessage(text, 'peer');
        if (!gameOver) {
            isMyTurn = true;
            updateTurnUI();
            enableChat(true);
        }
    });

    socket.on("peer-won", ({ text }) => {
        gameOver = true;
        enableChat(false);
        const indicator = document.getElementById('turn-indicator');
        indicator.innerHTML = `❌ Opponent guessed "${mySecretFood}"!`;
        indicator.style.background = "var(--accent-red-bg)";
        indicator.style.color = "#b91c1c";
        document.getElementById('reset-btn').classList.remove('hidden');
    });

    socket.on("error-msg", (msg) => {
        alert(msg);
    });

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text || !isMyTurn || gameOver) return;

        appendMessage(text, 'self');
        socket.emit("send-message", { roomCode: currentRoomCode, text });

        input.value = "";
        isMyTurn = false;
        updateTurnUI();
        enableChat(false);

        if (opponentSecretFood && text.toLowerCase().includes(opponentSecretFood.toLowerCase())) {
            gameOver = true;
            socket.emit("game-over", { roomCode: currentRoomCode, text });
            const indicator = document.getElementById('turn-indicator');
            indicator.innerHTML = `🎉 You Won!`;
            indicator.style.background = "var(--accent-green-bg)";
            indicator.style.color = "#047857";
            document.getElementById('reset-btn').classList.remove('hidden');
        }
    }

    function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }

    function appendMessage(text, className) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function appendSystemMessage(text) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'message system';
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function updateTurnUI() {
        if (gameOver) return;
        const indicator = document.getElementById('turn-indicator');
        if (isMyTurn) {
            indicator.innerHTML = `Your Turn`;
            indicator.style.background = "var(--accent-green-bg)";
            indicator.style.color = "#047857";
        } else {
            indicator.innerHTML = `Waiting for Opponent...`;
            indicator.style.background = "var(--accent-red-bg)";
            indicator.style.color = "#b91c1c";
        }
    }

    function enableChat(enable) {
        document.getElementById('msg-input').disabled = !enable || gameOver;
        document.getElementById('send-btn').disabled = !enable || gameOver;
    }
</script>

</body>
</html>

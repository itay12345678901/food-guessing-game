<!-- Include Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    // 1. Paste your Firebase config here from https://console.firebase.google.com/
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Food list setup
    const prefixes = ["Super", "Mega", "Cheesy", "Choco", "Crispy", "Sweet", "Spicy", "Garlic", "Honey", "Mini", "Giant", "Smokey", "Berry", "Butter", "Fruity", "Glazed", "Golden", "Truffle", "Toasted", "Salty", "Fresh", "Tangy", "Milky", "Nutty"];
    const baseFoods = ["burger", "pizza", "taco", "sushi", "apple", "donut", "pancake", "cookie", "noodle", "pasta", "waffle", "muffin", "steak", "pickle", "potato", "pretzel", "brownie", "maki", "bacon", "toast", "bagel", "nacho", "ramen", "cupcake", "tart", "bread", "cheese", "sandwich", "cherry", "mango", "berry", "melon", "biscuit", "crepe", "fondue", "kebab", "omelet", "paella", "pie", "salad"];

    const foods = [];
    for (let p of prefixes) {
        for (let b of baseFoods) {
            const word = p + b;
            foods.push(word.charAt(0).toUpperCase() + word.slice(1));
        }
    }

    let roomCode = "";
    let isCreator = false;
    let mySecretFood = "";
    let opponentSecretFood = "";
    let isMyTurn = false;
    let gameOver = false;
    let roomRef = null;

    function generateCode() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function createGame() {
        roomCode = generateCode();
        isCreator = true;
        initRoom();
    }

    function joinGame() {
        const input = document.getElementById('code-input').value.trim().toUpperCase();
        if (!input) return alert("Please enter a room code.");
        roomCode = input;
        isCreator = false;
        initRoom();
    }

    function initRoom() {
        roomRef = db.ref('rooms/' + roomCode);

        if (isCreator) {
            mySecretFood = foods[Math.floor(Math.random() * foods.length)];
            document.getElementById('my-secret').innerText = mySecretFood;
            
            roomRef.set({
                creatorSecret: mySecretFood,
                status: 'waiting',
                turn: 'creator'
            });

            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('waiting-section').classList.remove('hidden');
            document.getElementById('code-display').innerText = roomCode;
        } else {
            roomRef.once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    alert("Room not found!");
                    return;
                }
                
                mySecretFood = foods[Math.floor(Math.random() * foods.length)];
                document.getElementById('my-secret').innerText = mySecretFood;

                roomRef.update({
                    joinerSecret: mySecretFood,
                    status: 'playing'
                });

                document.getElementById('lobby-section').classList.add('hidden');
                document.getElementById('game-section').classList.remove('hidden');
            });
        }

        listenToRoom();
    }

    function listenToRoom() {
        // Listen to game state changes
        roomRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // When second player joins
            if (data.status === 'playing' && isCreator && gameSectionHidden()) {
                document.getElementById('waiting-section').classList.add('hidden');
                document.getElementById('game-section').classList.remove('hidden');
                appendSystemMessage("Player 2 connected! Game started.");
            }

            // Store opponent secret
            opponentSecretFood = isCreator ? data.joinerSecret : data.creatorSecret;

            // Turn updates
            if (data.status === 'playing') {
                isMyTurn = (data.turn === (isCreator ? 'creator' : 'joiner'));
                updateTurnUI();
                enableChat(isMyTurn);
            }

            // Game over handling
            if (data.status === 'ended') {
                gameOver = true;
                enableChat(false);
                const indicator = document.getElementById('turn-indicator');
                const won = data.winner === (isCreator ? 'creator' : 'joiner');
                
                if (won) {
                    indicator.innerHTML = `<span class="dot my-turn-dot"></span> 🎉 You Won!`;
                    indicator.style.background = "var(--accent-green-bg)";
                    indicator.style.color = "#047857";
                } else {
                    indicator.innerHTML = `<span class="dot peer-turn-dot"></span> ❌ Opponent guessed "${mySecretFood}"!`;
                    indicator.style.background = "var(--accent-red-bg)";
                    indicator.style.color = "#b91c1c";
                }
                document.getElementById('reset-btn').classList.remove('hidden');
            }
        });

        // Listen for incoming chat messages
        roomRef.child('messages').on('child_added', (snapshot) => {
            const msg = snapshot.val();
            const senderRole = isCreator ? 'creator' : 'joiner';
            if (msg.sender !== senderRole) {
                appendMessage(msg.text, 'peer');
            }
        });
    }

    function gameSectionHidden() {
        return document.getElementById('game-section').classList.contains('hidden');
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text || !isMyTurn || gameOver) return;

        const role = isCreator ? 'creator' : 'joiner';
        const nextTurn = isCreator ? 'joiner' : 'creator';

        // Add message to Firebase
        roomRef.child('messages').push({
            sender: role,
            text: text
        });

        appendMessage(text, 'self');
        input.value = "";

        // Check for win
        if (opponentSecretFood && text.toLowerCase().includes(opponentSecretFood.toLowerCase())) {
            roomRef.update({
                status: 'ended',
                winner: role
            });
        } else {
            roomRef.update({ turn: nextTurn });
        }
    }

    function checkEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function appendMessage(text, className) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function appendSystemMessage(text) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'message system';
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function updateTurnUI() {
        if (gameOver) return;
        const indicator = document.getElementById('turn-indicator');
        if (isMyTurn) {
            indicator.innerHTML = `<span class="dot my-turn-dot"></span> Your Turn`;
            indicator.style.background = "var(--accent-green-bg)";
            indicator.style.color = "#047857";
        } else {
            indicator.innerHTML = `<span class="dot peer-turn-dot"></span> Waiting for Opponent...`;
            indicator.style.background = "var(--accent-red-bg)";
            indicator.style.color = "#b91c1c";
        }
    }

    function enableChat(enable) {
        document.getElementById('msg-input').disabled = !enable || gameOver;
        document.getElementById('send-btn').disabled = !enable || gameOver;
    }

    function resetGame() {
        if (roomRef) roomRef.remove();
        location.reload();
    }
</script>
